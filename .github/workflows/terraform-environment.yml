name: Terraform environment verification

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Protected environment to verify
        required: true
        type: choice
        options:
          - uat
          - production

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-environment-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify ${{ inputs.environment }} Terraform identity
    environment: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      - name: Authenticate as the Terraform identity
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.BAZORIA_GOOGLE_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZORIA_GOOGLE_TERRAFORM_SERVICE_ACCOUNT }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Produce a read-only platform plan
        env:
          BAZORIA_ENVIRONMENT: ${{ inputs.environment }}
          TF_DATA_DIR: ${{ runner.temp }}/terraform-platform-${{ inputs.environment }}
        run: |
          terraform -chdir=infrastructure/google-cloud/platform init \
            -input=false \
            -backend-config="../environments/${BAZORIA_ENVIRONMENT}/platform.gcs.tfbackend"
          terraform -chdir=infrastructure/google-cloud/platform plan \
            -input=false \
            -lock-timeout=60s \
            -var-file="../environments/${BAZORIA_ENVIRONMENT}/platform.tfvars.json" \
            -out="${RUNNER_TEMP}/bazoria-${BAZORIA_ENVIRONMENT}-platform.tfplan"
          terraform -chdir=infrastructure/google-cloud/platform show \
            -json "${RUNNER_TEMP}/bazoria-${BAZORIA_ENVIRONMENT}-platform.tfplan" \
            > "${RUNNER_TEMP}/bazoria-${BAZORIA_ENVIRONMENT}-platform.tfplan.json"
          node scripts/terraform/foundation-plan-contract.mjs \
            --plan "${RUNNER_TEMP}/bazoria-${BAZORIA_ENVIRONMENT}-platform.tfplan.json" \
            --environment "${BAZORIA_ENVIRONMENT}" \
            --root platform

      - name: Attempt forbidden artifact-role impersonation
        id: forbidden-artifact-role
        continue-on-error: true
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.BAZORIA_GOOGLE_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZORIA_GOOGLE_ARTIFACT_SERVICE_ACCOUNT }}
          create_credentials_file: false
          token_format: access_token
          access_token_lifetime: 300s

      - name: Assert cross-role impersonation was denied
        env:
          FORBIDDEN_OUTCOME: ${{ steps.forbidden-artifact-role.outcome }}
        run: |
          if [[ "${FORBIDDEN_OUTCOME}" != "failure" ]]; then
            printf 'Terraform provider unexpectedly impersonated the artifact-release account.\n' >&2
            exit 1
          fi
