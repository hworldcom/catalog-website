name: UAT runtime release

on:
  workflow_dispatch:
    inputs:
      operation:
        description: UAT release operation
        required: true
        type: choice
        options:
          - plan
          - apply
          - verify-edge
          - finalize
      git_commit:
        description: Exact 40-character commit used for the published image
        required: true
        type: string
      image_digest:
        description: Exact sha256 digest from the successful 0038f2 handoff
        required: true
        type: string
      plan_fingerprint:
        description: Fingerprint returned by the latest UAT runtime release plan
        required: false
        type: string
      expected_uat_project_ref:
        description: Explicit UAT Supabase project confirmation
        required: true
        default: mekobnkujzpzeiwmecyy
        type: string
      guided_checklist_version:
        description: Version of the completed guided UAT checklist
        required: false
        type: string
      guided_checklist_confirmed:
        description: Confirm the guided UAT checklist was completed
        required: false
        default: false
        type: boolean
      apply_result:
        description: Numeric GitHub Actions run ID from the successful UAT apply URL
        required: false
        type: string

permissions:
  actions: read
  contents: read
  id-token: write

concurrency:
  group: uat-runtime-release
  cancel-in-progress: false

jobs:
  release:
    name: UAT ${{ inputs.operation }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    environment: uat
    env:
      BAZORIA_ENVIRONMENT: uat
      RELEASE_COMMIT: ${{ inputs.git_commit }}
      RELEASE_IMAGE_DIGEST: ${{ inputs.image_digest }}
      EXPECTED_PROJECT_REF: ${{ inputs.expected_uat_project_ref }}
      BAZORIA_GOOGLE_PROJECT_ID: ${{ vars.BAZORIA_GOOGLE_PROJECT_ID }}
      BAZORIA_GOOGLE_REGION: ${{ vars.BAZORIA_GOOGLE_REGION }}
      BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST: ${{ vars.BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST }}
      BAZORIA_GOOGLE_ARTIFACT_REPOSITORY_ID: ${{ vars.BAZORIA_GOOGLE_ARTIFACT_REPOSITORY_ID }}
      SUPABASE_URL: ${{ vars.SUPABASE_URL }}
      SUPABASE_PUBLISHABLE_KEY: ${{ vars.SUPABASE_PUBLISHABLE_KEY }}
      BAZORIA_SUPABASE_SERVICE_ROLE_SECRET_VERSION: ${{ vars.BAZORIA_SUPABASE_SERVICE_ROLE_SECRET_VERSION }}
      BAZORIA_OPENAI_API_KEY_SECRET_VERSION: ${{ vars.BAZORIA_OPENAI_API_KEY_SECRET_VERSION }}
      BAZORIA_PROTOTYPE_ADMIN_USER_IDS: ${{ vars.BAZORIA_PROTOTYPE_ADMIN_USER_IDS }}
      BAZORIA_PUBLIC_SITE_URL: ${{ vars.BAZORIA_PUBLIC_SITE_URL }}
      BAZORIA_GOOGLE_MONITORING_NOTIFICATION_CHANNEL_NAMES: ${{ vars.BAZORIA_GOOGLE_MONITORING_NOTIFICATION_CHANNEL_NAMES }}
      BAZORIA_UAT_DATABASE_URL: ${{ secrets.BAZORIA_UAT_DATABASE_URL }}

    steps:
      - name: Check out deployment source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify release request
        shell: bash
        run: |
          set -euo pipefail
          [[ "${RELEASE_COMMIT}" =~ ^[0-9a-f]{40}$ ]]
          [[ "${RELEASE_IMAGE_DIGEST}" =~ ^sha256:[0-9a-f]{64}$ ]]
          [[ "${EXPECTED_PROJECT_REF}" == "mekobnkujzpzeiwmecyy" ]]
          git cat-file -e "${RELEASE_COMMIT}^{commit}"
          git merge-base --is-ancestor "${RELEASE_COMMIT}" "origin/${GITHUB_REF_NAME}"
          expected_image="${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST}/${BAZORIA_GOOGLE_PROJECT_ID}/${BAZORIA_GOOGLE_ARTIFACT_REPOSITORY_ID}/bazoria-web@${RELEASE_IMAGE_DIGEST}"
          printf 'release_commit=%s\nimage=%s\n' "${RELEASE_COMMIT}" "${expected_image}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Set up pinned Node.js
        if: inputs.operation != 'verify-edge'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22.13.0
          cache: npm

      - name: Install pinned npm and dependencies
        if: inputs.operation != 'verify-edge'
        shell: bash
        run: |
          set -euo pipefail
          npm install --global npm@10.9.2
          test "$(node --version)" = "v22.13.0"
          test "$(npm --version)" = "10.9.2"
          npm ci

      - name: Authenticate as the Terraform identity
        id: terraform-auth
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093
        with:
          workload_identity_provider: ${{ vars.BAZORIA_GOOGLE_TERRAFORM_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.BAZORIA_GOOGLE_TERRAFORM_SERVICE_ACCOUNT }}
          token_format: access_token

      - name: Verify published immutable artifact
        env:
          ACCESS_TOKEN: ${{ steps.terraform-auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          image="${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST}/${BAZORIA_GOOGLE_PROJECT_ID}/${BAZORIA_GOOGLE_ARTIFACT_REPOSITORY_ID}/bazoria-web:release-${RELEASE_COMMIT}"
          encoded_image="$(jq -rn --arg value "bazoria-web@${RELEASE_IMAGE_DIGEST}" '$value | @uri')"
          metadata_path="${RUNNER_TEMP}/release-image-metadata.json"
          curl --fail-with-body --silent --show-error \
            --header "Authorization: Bearer ${ACCESS_TOKEN}" \
            "https://artifactregistry.googleapis.com/v1/projects/${BAZORIA_GOOGLE_PROJECT_ID}/locations/${BAZORIA_GOOGLE_REGION}/repositories/${BAZORIA_GOOGLE_ARTIFACT_REPOSITORY_ID}/dockerImages/${encoded_image}" \
            > "${metadata_path}"
          jq --exit-status \
            --arg expected_uri "${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST}/${BAZORIA_GOOGLE_PROJECT_ID}/${BAZORIA_GOOGLE_ARTIFACT_REPOSITORY_ID}/bazoria-web@${RELEASE_IMAGE_DIGEST}" \
            '.uri == $expected_uri' "${metadata_path}" > /dev/null
          docker login "${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST}" --username oauth2accesstoken --password-stdin <<< "${ACCESS_TOKEN}"
          resolved_digest="$(docker buildx imagetools inspect "${image}" | sed -n 's/^Digest:[[:space:]]*//p' | head -n 1)"
          test "${resolved_digest}" = "${RELEASE_IMAGE_DIGEST}"
          docker buildx imagetools inspect --format '{{json .Image}}' "${image}" \
            > "${RUNNER_TEMP}/release-image-config.json"
          jq --exit-status '.architecture == "amd64" and .os == "linux"' \
            "${RUNNER_TEMP}/release-image-config.json" > /dev/null

      - name: Verify successful 0038f2 handoff
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          artifact_name="uat-release-${RELEASE_COMMIT}"
          run_id="$(gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?name=${artifact_name}&per_page=100" \
            --jq '[.artifacts[] | select(.expired == false)] | sort_by(.created_at) | last | .workflow_run.id')"
          if [[ ! "${run_id}" =~ ^[0-9]+$ ]]; then
            printf 'No active release handoff artifact found: %s\n' "${artifact_name}" >&2
            exit 1
          fi
          [[ "${run_id}" =~ ^[0-9]+$ ]]
          mkdir -p "${RUNNER_TEMP}/release-handoff"
          gh run download "${run_id}" \
            --name "${artifact_name}" --dir "${RUNNER_TEMP}/release-handoff"
          handoff="${RUNNER_TEMP}/release-handoff/release-handoff.json"
          jq --exit-status \
            --arg commit "${RELEASE_COMMIT}" \
            --arg digest "${RELEASE_IMAGE_DIGEST}" \
            '.commit == $commit and .digest == $digest and .results.containerHealth.status == "passed" and .results.registryVerification.status == "passed"' \
            "${handoff}" > /dev/null

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.15.9
          terraform_wrapper: false

      - name: Prepare temporary UAT database target
        if: inputs.operation != 'verify-edge'
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          printf 'BAZORIA_SUPABASE_PROJECT_REF=%s\nSUPABASE_URL=%s\nBAZORIA_SUPABASE_DATABASE_URL=%s\n' \
            "${EXPECTED_PROJECT_REF}" "${SUPABASE_URL}" "${BAZORIA_UAT_DATABASE_URL}" \
            > "${RUNNER_TEMP}/.env.supabase.uat.local"
          cp "${RUNNER_TEMP}/.env.supabase.uat.local" .env.supabase.uat.local

      - name: Run UAT database preflight
        if: inputs.operation == 'plan'
        run: npm run db:environment:preflight -- --environment uat

      - name: Capture reviewed migration target
        if: inputs.operation != 'verify-edge'
        shell: bash
        run: |
          set -euo pipefail
          node scripts/deployment/uat-runtime-release.mjs migration-target \
            --commit "${RELEASE_COMMIT}" \
            --output "${RUNNER_TEMP}/uat-migration-target.json"
          jq --exit-status '.head != null and (.checksum | test("^[0-9a-f]{64}$"))' \
            "${RUNNER_TEMP}/uat-migration-target.json" > /dev/null
          jq -r '"migration_head=" + .head + "\nmigration_source_checksum=" + .checksum' \
            "${RUNNER_TEMP}/uat-migration-target.json" >> "${GITHUB_STEP_SUMMARY}"

      - name: Prepare UAT Terraform variables
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          [[ "${BAZORIA_SUPABASE_SERVICE_ROLE_SECRET_VERSION}" =~ ^[1-9][0-9]*$ ]]
          [[ "${BAZORIA_OPENAI_API_KEY_SECRET_VERSION}" =~ ^[1-9][0-9]*$ ]]
          jq \
            --arg project "${BAZORIA_GOOGLE_PROJECT_ID}" \
            --arg region "${BAZORIA_GOOGLE_REGION}" \
            --arg digest "${RELEASE_IMAGE_DIGEST}" \
            --arg commit "${RELEASE_COMMIT}" \
            --arg supabase_url "${SUPABASE_URL}" \
            --arg publishable_key "${SUPABASE_PUBLISHABLE_KEY}" \
            --arg supabase_secret "projects/${BAZORIA_GOOGLE_PROJECT_ID}/secrets/bazoria-uat-supabase-service-role/versions/${BAZORIA_SUPABASE_SERVICE_ROLE_SECRET_VERSION}" \
            --arg openai_secret "projects/${BAZORIA_GOOGLE_PROJECT_ID}/secrets/bazoria-uat-openai-api-key/versions/${BAZORIA_OPENAI_API_KEY_SECRET_VERSION}" \
            --arg origin "${BAZORIA_PUBLIC_SITE_URL}" \
            --arg admin_ids "${BAZORIA_PROTOTYPE_ADMIN_USER_IDS}" \
            --arg channels "${BAZORIA_GOOGLE_MONITORING_NOTIFICATION_CHANNEL_NAMES}" \
            '. + {
              runtime_configuration: {
                image_reference: ("europe-west3-docker.pkg.dev/" + $project + "/bazoria-uat-containers/bazoria-web@" + $digest),
                release_commit: $commit,
                build_id: ("release-" + $commit),
                supabase_url: $supabase_url,
                supabase_publishable_key: $publishable_key,
                supabase_service_role_secret_version: $supabase_secret,
                openai_api_key_secret_version: $openai_secret,
                canonical_origin: $origin,
                prototype_administrator_user_ids: $admin_ids,
                description_generation_model: "gpt-5.4-nano"
              },
              monitoring_configuration: {
                alerting_enabled: true,
                notification_channel_names: ($channels | split(",") | map(select(length > 0)))
              }
            }' infrastructure/google-cloud/environments/uat/platform.tfvars.json \
            > "${RUNNER_TEMP}/uat-platform.tfvars.json"

      - name: Initialize Terraform and create reviewed plan
        if: inputs.operation != 'verify-edge'
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-platform-uat
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/google-cloud/platform init \
            -input=false -backend-config="../environments/uat/platform.gcs.tfbackend"
          terraform -chdir=infrastructure/google-cloud/platform plan \
            -input=false -lock-timeout=60s \
            -var-file="${RUNNER_TEMP}/uat-platform.tfvars.json" \
            -out="${RUNNER_TEMP}/uat-platform.tfplan"
          terraform -chdir=infrastructure/google-cloud/platform show -json \
            "${RUNNER_TEMP}/uat-platform.tfplan" > "${RUNNER_TEMP}/uat-platform.tfplan.json"
          node scripts/deployment/uat-runtime-release.mjs fingerprint \
            --plan "${RUNNER_TEMP}/uat-platform.tfplan.json" \
            --commit "${RELEASE_COMMIT}" \
            --digest "${RELEASE_IMAGE_DIGEST}" \
            --migration-target "${RUNNER_TEMP}/uat-migration-target.json" \
            --config "${RUNNER_TEMP}/uat-platform.tfvars.json" \
            --output "${RUNNER_TEMP}/uat-plan-fingerprint.txt"
          printf 'plan_fingerprint=%s\n' "$(<"${RUNNER_TEMP}/uat-plan-fingerprint.txt")" >> "${GITHUB_STEP_SUMMARY}"

      - name: Apply reviewed database migrations and Terraform plan
        if: inputs.operation == 'apply'
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-platform-uat
        shell: bash
        run: |
          set -euo pipefail
          [[ -n "${{ inputs.plan_fingerprint }}" ]]
          node scripts/deployment/uat-runtime-release.mjs assert-fingerprint \
            --plan "${RUNNER_TEMP}/uat-platform.tfplan.json" \
            --commit "${RELEASE_COMMIT}" \
            --digest "${RELEASE_IMAGE_DIGEST}" \
            --migration-target "${RUNNER_TEMP}/uat-migration-target.json" \
            --config "${RUNNER_TEMP}/uat-platform.tfvars.json" \
            --expected "${{ inputs.plan_fingerprint }}"
          npm run db:environment:migrate -- --environment uat --confirm-project "${EXPECTED_PROJECT_REF}"
          terraform -chdir=infrastructure/google-cloud/platform apply \
            -input=false "${RUNNER_TEMP}/uat-platform.tfplan"
          terraform -chdir=infrastructure/google-cloud/platform output -json edge_inventory \
            > "${RUNNER_TEMP}/uat-edge-inventory.json"
          jq -r '
            "edge_state=awaiting_dns",
            "uat_hostname=" + .hostname,
            "uat_ipv4_address=" + .ipv4_address,
            "dns_a_name=" + .dns_records.application.name,
            "dns_a_value=" + .dns_records.application.value,
            "certificate_authorization_name=" + .dns_records.certificate_authorization.name,
            "certificate_authorization_type=" + .dns_records.certificate_authorization.type,
            "certificate_authorization_value=" + .dns_records.certificate_authorization.home_pl_value
          ' "${RUNNER_TEMP}/uat-edge-inventory.json" >> "${GITHUB_STEP_SUMMARY}"
          {
            printf 'apply_result=%s\n' "${GITHUB_RUN_ID}"
            printf 'For finalize, paste `%s` into the `apply_result` input.\n' "${GITHUB_RUN_ID}"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Read deployed UAT edge inventory
        if: inputs.operation == 'verify-edge'
        env:
          TF_DATA_DIR: ${{ runner.temp }}/terraform-platform-uat
        shell: bash
        run: |
          set -euo pipefail
          terraform -chdir=infrastructure/google-cloud/platform init \
            -input=false -backend-config="../environments/uat/platform.gcs.tfbackend"
          terraform -chdir=infrastructure/google-cloud/platform output -json edge_inventory \
            > "${RUNNER_TEMP}/uat-edge-inventory.json"

      - name: Verify UAT edge
        if: inputs.operation == 'verify-edge'
        shell: bash
        run: |
          set -euo pipefail
          hostname="$(jq -er '.hostname' "${RUNNER_TEMP}/uat-edge-inventory.json")"
          ipv4="$(jq -er '.ipv4_address' "${RUNNER_TEMP}/uat-edge-inventory.json")"
          certificate_map="$(jq -er '.load_balancer.certificate_map' "${RUNNER_TEMP}/uat-edge-inventory.json")"
          test "$(dig +short A "${hostname}" | tail -n 1)" = "${ipv4}"
          test "$(curl --fail-with-body --silent --show-error \
            --output /dev/null --write-out '%{http_code}' "https://${hostname}/healthz")" = "204"
          catalog_body="$(curl --fail-with-body --silent --show-error \
            "https://${hostname}/?lang=EN&audience=women")"
          grep -Fq 'bazoria-public-catalog-v1' <<< "${catalog_body}"
          gcloud certificate-manager maps entries list \
            --map "${certificate_map}" --project "${BAZORIA_GOOGLE_PROJECT_ID}" \
            --location=global --format='value(state,hostname)' > "${RUNNER_TEMP}/uat-certificate-map.txt"
          test -s "${RUNNER_TEMP}/uat-certificate-map.txt"
          printf 'edge_state=verified\nuat_hostname=%s\n' "${hostname}" >> "${GITHUB_STEP_SUMMARY}"

      - name: Install ORAS for release finalization
        if: inputs.operation == 'finalize'
        uses: oras-project/setup-oras@1d808f7d7f6995cc68b7bf507bfe5c5446e1dc9d
        with:
          version: 1.3.3

      - name: Finalize durable UAT release
        if: inputs.operation == 'finalize'
        env:
          ACCESS_TOKEN: ${{ steps.terraform-auth.outputs.access_token }}
          GUIDED_CHECKLIST_CONFIRMED: ${{ inputs.guided_checklist_confirmed }}
          GUIDED_CHECKLIST_VERSION: ${{ inputs.guided_checklist_version }}
          APPLY_RESULT: ${{ inputs.apply_result }}
          PLAN_FINGERPRINT: ${{ inputs.plan_fingerprint }}
          ORAS_REGISTRY_CONFIG: ${{ runner.temp }}/oras-config.json
        shell: bash
        run: |
          set -euo pipefail
          [[ "${GUIDED_CHECKLIST_CONFIRMED}" == "true" ]]
          [[ -n "${GUIDED_CHECKLIST_VERSION}" ]]
          [[ "${PLAN_FINGERPRINT}" =~ ^[0-9a-f]{64}$ ]]
          [[ "${APPLY_RESULT}" =~ ^[0-9]+$ ]]

          node scripts/deployment/uat-runtime-release.mjs assert-fingerprint \
            --plan "${RUNNER_TEMP}/uat-platform.tfplan.json" \
            --commit "${RELEASE_COMMIT}" \
            --digest "${RELEASE_IMAGE_DIGEST}" \
            --migration-target "${RUNNER_TEMP}/uat-migration-target.json" \
            --config "${RUNNER_TEMP}/uat-platform.tfvars.json" \
            --expected "${PLAN_FINGERPRINT}"

          hostname="${BAZORIA_PUBLIC_SITE_URL#https://}"
          hostname="${hostname%%/*}"
          test "$(curl --fail-with-body --silent --show-error \
            --output /dev/null --write-out '%{http_code}' "https://${hostname}/healthz")" = "204"
          version_path="${RUNNER_TEMP}/uat-version.json"
          curl --fail-with-body --silent --show-error "https://${hostname}/version" > "${version_path}"
          jq --exit-status \
            --arg commit "${RELEASE_COMMIT}" \
            --arg digest "${RELEASE_IMAGE_DIGEST}" \
            '.releaseCommit == $commit and .imageDigest == $digest and .buildId == ("release-" + $commit) and .environment == "uat"' \
            "${version_path}" > /dev/null

          handoff="${RUNNER_TEMP}/release-handoff/release-handoff.json"
          jq --exit-status \
            --arg commit "${RELEASE_COMMIT}" \
            --arg digest "${RELEASE_IMAGE_DIGEST}" \
            '.commit == $commit and .digest == $digest and .results.containerHealth.status == "passed" and .results.registryVerification.status == "passed"' \
            "${handoff}" > /dev/null

          image="${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST}/${BAZORIA_GOOGLE_PROJECT_ID}/${BAZORIA_GOOGLE_ARTIFACT_REPOSITORY_ID}/bazoria-web"
          deployed_ref="${image}:deployed-uat"
          previous_digest=""
          if previous_digest="$(gcloud artifacts docker images describe "${deployed_ref}" \
            --project="${BAZORIA_GOOGLE_PROJECT_ID}" \
            --format='value(image_summary.digest)' 2>/dev/null)"; then
            [[ "${previous_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
          fi

          record_input="${RUNNER_TEMP}/uat-release-record-input.json"
          jq -n \
            --arg commit "${RELEASE_COMMIT}" \
            --arg digest "${RELEASE_IMAGE_DIGEST}" \
            --arg image "${image}" \
            --arg build "release-${RELEASE_COMMIT}" \
            --arg plan "${PLAN_FINGERPRINT}" \
            --arg apply "${APPLY_RESULT}" \
            --arg checklist "${GUIDED_CHECKLIST_VERSION}" \
            --arg previous "${previous_digest}" \
            --arg repository "${GITHUB_REPOSITORY}" \
            --arg workflow "${GITHUB_WORKFLOW}" \
            --arg run_id "${GITHUB_RUN_ID}" \
            --arg run_attempt "${GITHUB_RUN_ATTEMPT}" \
            --arg requester "${GITHUB_ACTOR}" \
            --arg run_url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --arg finalized_at "$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)" \
            --slurpfile migration "${RUNNER_TEMP}/uat-migration-target.json" \
            --slurpfile config "${RUNNER_TEMP}/uat-platform.tfvars.json" \
            --slurpfile handoff_file "${handoff}" \
            '{
              commit: $commit,
              digest: $digest,
              planFingerprint: $plan,
              guidedChecklistVersion: $checklist,
              guidedChecklistConfirmed: true,
              environment: "uat",
              smokeStatus: "passed",
              edgeStatus: "verified",
              migrations: $migration[0].migrations,
              configurationNames: ($config[0].runtime_configuration | keys),
              secretVersions: [$config[0].runtime_configuration.supabase_service_role_secret_version, $config[0].runtime_configuration.openai_api_key_secret_version],
              imageReference: $image,
              buildId: $build,
              applyResult: $apply,
              repository: $repository,
              workflow: $workflow,
              runId: $run_id,
              runAttempt: $run_attempt,
              requester: $requester,
              runUrl: $run_url,
              previousDeployedUatDigest: (if $previous == "" then null else $previous end),
              finalizedAt: $finalized_at,
              handoff: $handoff_file[0]
            }' > "${record_input}"
          record_path="${RUNNER_TEMP}/uat-release-record.json"
          node scripts/deployment/uat-release-finalize.mjs "${record_input}" "${record_path}"

          printf '%s' "${ACCESS_TOKEN}" | oras login "${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST}" \
            --username oauth2accesstoken --password-stdin \
            --registry-config "${ORAS_REGISTRY_CONFIG}"
          record_repository="${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST}/${BAZORIA_GOOGLE_PROJECT_ID}/bazoria-release-record"
          record_tag="${record_repository}:uat-${RELEASE_COMMIT}"
          if existing_record_digest="$(oras resolve "${record_tag}" --registry-config "${ORAS_REGISTRY_CONFIG}" 2>/dev/null)"; then
            [[ "${existing_record_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            record_digest="${existing_record_digest}"
          else
            temporary_record="${record_repository}:finalize-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            record_digest="$(oras push "${temporary_record}" \
              --artifact-type application/vnd.bazoria.release-record.v1+json \
              --registry-config "${ORAS_REGISTRY_CONFIG}" \
              "${record_path}:application/json" 2>&1 | sed -n 's/.*Digest: //p' | tail -n 1)"
            [[ "${record_digest}" =~ ^sha256:[0-9a-f]{64}$ ]]
            oras tag "${temporary_record}" "uat-${RELEASE_COMMIT}" \
              --registry-config "${ORAS_REGISTRY_CONFIG}"
          fi

          promotion_ref="${image}:promotion-eligible-${RELEASE_COMMIT}"
          promotion_created=false
          deployed_changed=false
          restore_tags() {
            if [[ "${deployed_changed}" == "true" ]]; then
              if [[ -n "${previous_digest}" ]]; then
                gcloud artifacts docker tags add "${image}@${previous_digest}" "${deployed_ref}" \
                  --project="${BAZORIA_GOOGLE_PROJECT_ID}" >/dev/null
              else
                gcloud artifacts docker tags delete "${deployed_ref}" \
                  --project="${BAZORIA_GOOGLE_PROJECT_ID}" --quiet >/dev/null
              fi
            fi
            if [[ "${promotion_created}" == "true" ]]; then
              gcloud artifacts docker tags delete "${promotion_ref}" \
                --project="${BAZORIA_GOOGLE_PROJECT_ID}" --quiet >/dev/null
            fi
          }
          trap 'status=$?; if (( status != 0 )); then restore_tags || true; fi; exit "$status"' EXIT
          if existing_promotion="$(gcloud artifacts docker images describe "${promotion_ref}" \
            --project="${BAZORIA_GOOGLE_PROJECT_ID}" \
            --format='value(image_summary.digest)' 2>/dev/null)"; then
            [[ "${existing_promotion}" == "${RELEASE_IMAGE_DIGEST}" ]]
          else
            gcloud artifacts docker tags add "${image}@${RELEASE_IMAGE_DIGEST}" "${promotion_ref}" \
              --project="${BAZORIA_GOOGLE_PROJECT_ID}"
            promotion_created=true
          fi
          deployed_changed=true
          gcloud artifacts docker tags add "${image}@${RELEASE_IMAGE_DIGEST}" "${deployed_ref}" \
            --project="${BAZORIA_GOOGLE_PROJECT_ID}"
          test "$(gcloud artifacts docker images describe "${promotion_ref}" --project="${BAZORIA_GOOGLE_PROJECT_ID}" --format='value(image_summary.digest)')" = "${RELEASE_IMAGE_DIGEST}"
          test "$(gcloud artifacts docker images describe "${deployed_ref}" --project="${BAZORIA_GOOGLE_PROJECT_ID}" --format='value(image_summary.digest)')" = "${RELEASE_IMAGE_DIGEST}"
          printf 'release_record_digest=%s\npromotion_eligible_digest=%s\ndeployed_uat_digest=%s\n' \
            "${record_digest}" "${RELEASE_IMAGE_DIGEST}" "${RELEASE_IMAGE_DIGEST}" >> "${GITHUB_STEP_SUMMARY}"
          trap - EXIT

      - name: Remove temporary credentials and plans
        if: always()
        shell: bash
        run: |
          rm -f .env.supabase.uat.local
          docker logout "${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST:-europe-west3-docker.pkg.dev}" >/dev/null 2>&1 || true
          if [[ -n "${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST:-}" && -n "${ORAS_REGISTRY_CONFIG:-}" ]]; then
            oras logout "${BAZORIA_GOOGLE_ARTIFACT_REGISTRY_HOST}" \
              --registry-config "${ORAS_REGISTRY_CONFIG}" >/dev/null 2>&1 || true
            rm -f "${ORAS_REGISTRY_CONFIG}"
          fi
